# 1) Anade el plugin a la lista de plugins activos de extra_cfg.yml:
EnablePlugins:
  - MapVotePlugin

# 2) Anade al final de extra_cfg.yml la configuracion del plugin:
---
!MapVoteConfiguration
# Carpeta con los circuitos instalados (relativa a donde se ejecuta AssettoServer)
TracksFolder: content/tracks
# Reglas de la votacion
VoteDurationSeconds: 60
CooldownSeconds: 120
# Segundos entre aprobar y reiniciar el servidor
ChangeDelaySeconds: 10
# Quien propone cuenta como voto a favor
ProposerVotesYes: true
# Exit = el plugin cierra el servidor y el lanzador lo reinicia
# File = el plugin solo crea RestartFlagFile y un reiniciador externo hace el resto
RestartMode: Exit
SelectionFile: map_selection.json
RestartFlagFile: map_restart.flag
# Carpetas de circuito que NO deben aparecer en la lista
ExcludeTracks: []
